name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B verify

  deploy:
    # Runs only on main once the GCP repository variables/secrets are configured (see README).
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      SERVICE: portfolio-backend
      REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --memory 512Mi \
            --max-instances 2 \
            --set-env-vars "^@^DB_URL=${{ vars.DB_URL }}@DB_USERNAME=${{ vars.DB_USERNAME }}@CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" \
            --set-secrets "DB_PASSWORD=${{ vars.DB_PASSWORD_SECRET || 'portfolio-db-password' }}:latest"
      - name: Show service URL
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)'
